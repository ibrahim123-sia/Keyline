name: Feature request
description: Suggest a change or a new feature
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who needs this, and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should happen. Screens, settings or data it touches.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
