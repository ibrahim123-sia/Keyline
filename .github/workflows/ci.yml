name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, types, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - name: Migrations match the schema
        run: |
          pnpm exec drizzle-kit check
          pnpm exec drizzle-kit generate --name ci-drift-check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::db/schema changed without a migration. Run 'pnpm db:generate' and commit it."
            git status --porcelain db/migrations
            exit 1
          fi
      - run: scripts/ci/run.sh "Unit tests" pnpm test:unit
      - run: scripts/ci/run.sh "Integration tests" pnpm test:integration

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      # No dependency cache here: this job never installs, so there is nothing to save.
      # setup-node v5 turns caching on by itself when package.json has `packageManager`.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false
      - run: scripts/ci/run.sh "Dependency audit" pnpm audit --prod --audit-level high

  e2e:
    name: Playwright (production build)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: scripts/ci/run.sh "Playwright" pnpm test:e2e
        env:
          CI: "true"
          E2E_MODE: prod
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  workers-build:
    name: Cloudflare Workers bundle (OpenNext)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/postgres
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start a database for prerendering
        run: |
          nohup pnpm exec tsx scripts/test-db-server.ts 5433 > test-db.log 2>&1 &
          for i in $(seq 1 60); do (echo > /dev/tcp/127.0.0.1/5433) 2>/dev/null && break; sleep 2; done
      - run: scripts/ci/run.sh "OpenNext build" pnpm exec opennextjs-cloudflare build
      - name: Bundle size
        run: du -sh .open-next/worker.js .open-next/server-functions .open-next/assets

  deploy-staging:
    name: Deploy staging (Cloudflare)
    needs: [check, e2e, workers-build]
    # Turned on by the repository variable DEPLOY_STAGING=true once the Cloudflare and Neon
    # secrets exist (see README "Deploy to Cloudflare").
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_STAGING == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Direct (non-Hyperdrive) URL: migrations and build-time prerendering.
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      APP_URL: ${{ vars.STAGING_APP_URL }}
      BETTER_AUTH_URL: ${{ vars.STAGING_APP_URL }}
      LINTEL_ENV: staging
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
      - name: Fill in the Hyperdrive id
        run: sed -i "s/__HYPERDRIVE_ID_STAGING__/${{ secrets.HYPERDRIVE_ID_STAGING }}/" wrangler.jsonc
      - name: Build and deploy
        run: pnpm exec opennextjs-cloudflare build && pnpm exec opennextjs-cloudflare deploy --env staging -- --keep-vars
      - name: Smoke test
        run: curl --fail --retry 5 --retry-delay 5 "${{ vars.STAGING_APP_URL }}/api/health"
